<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameHub - Categories</title>

<link rel="stylesheet" href="style/style.css">
<link rel="stylesheet" href="style/game.css">
<link rel="stylesheet" href="style/category.css">

</head>

<body>

<header class="header">

<div class="logo">
    <a href="index.html">GameHub</a>
</div>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="game.html">Games</a>
    <a href="categories.html" class="active">Categories</a>
    <a href="search.html">Search</a>
</nav>

<div class="auth-buttons" id="authButtons">
    <a href="login.html" class="auth-btn login-btn">Sign In</a>
    <a href="register.html" class="auth-btn register-btn">Sign Up</a>
</div>

</header>

<main>

<section class="category-page">

    <div class="category-title">
        <h1>Game Categories</h1>
        <p>Explore games by genre</p>
    </div>

    <div class="genre-selector">

        <button id="genrePrev" class="genre-arrow">
            ←
        </button>

        <div id="genreBar" class="genre-bar"></div>

        <button id="genreNext" class="genre-arrow">
            →
        </button>

    </div>

    <div class="selected-category">
        <h2 id="selectedGenre">All Games</h2>
    </div>

    <div id="categoryGames" class="games-grid">
        <p id="loading">Loading games...</p>
    </div>

    <div class="pagination">

        <button id="prevBtn" disabled>
            ← Previous
        </button>

        <span id="pageNumber">
            Page 1
        </span>

        <button id="nextBtn">
            Next →
        </button>

    </div>

</section>

</main>

<footer> <p>© 2026 GameHub. All rights reserved.</p> </footer>

<script src="script/auth-header.js"></script>

<script src="script/categories.js"></script>

</body> </html>
