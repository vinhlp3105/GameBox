
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameHub | Home</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            <a href="index.html">
                Game<span>Hub</span>
            </a>
        </div>


        <nav class="navbar">

            <a href="index.html" class="active">
                Home
            </a>

            <a href="games.html">
                Games
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="search.html">
                Search
            </a>

        </nav>


        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search games..."
            >

            <button id="searchBtn">
                🔍
            </button>

        </div>

    </header>



    <!-- ================= HERO ================= -->

    <main>

        <section class="hero" id="home">

            <button
                class="slider-btn prev"
                id="prevBtn"
                aria-label="Previous game">

                ❮

            </button>


            <div class="hero-content">


                <div class="hero-image">

                    <img
                        id="heroImage"
                        src=""
                        alt="Featured game">

                </div>


                <div class="hero-info">

                    <p class="hero-label">
                        FEATURED GAME
                    </p>


                    <h1 id="heroTitle">
                        Loading...
                    </h1>


                    <div class="game-meta">

                        <span id="heroRating">
                            ⭐ --
                        </span>

                        <span id="heroGenre">
                            🎮 Game
                        </span>

                    </div>


                    <p id="heroDescription">
                        Loading game information...
                    </p>


                    <button
                        class="play-btn"
                        id="detailsBtn">

                        VIEW DETAILS

                    </button>

                </div>

            </div>


            <button
                class="slider-btn next"
                id="nextBtn"
                aria-label="Next game">

                ❯

            </button>


            <div
                class="dots"
                id="dots">
            </div>

        </section>



        <!-- ================= TOP 5 ================= -->

        <section
            class="section"
            id="games">

            <div class="section-title">

                <div>

                    <p class="small-title">
                        POPULAR NOW
                    </p>

                    <h2>
                        TOP 5 GAMES
                    </h2>

                </div>


                <a
                    href="games.html"
                    class="view-all">

                    View All →

                </a>

            </div>


            <div
                class="game-grid"
                id="topGames">

                <div class="loading">
                    Loading games...
                </div>

            </div>

        </section>



        <!-- ================= CATEGORIES ================= -->

        <section
            class="section"
            id="categories">

            <div class="section-title">

                <div>

                    <p class="small-title">
                        EXPLORE
                    </p>

                    <h2>
                        GAME CATEGORIES
                    </h2>

                </div>


                <a
                    href="categories.html"
                    class="view-all">

                    View All →

                </a>

            </div>


            <div class="category-buttons">

                <button
                    class="category-btn active"
                    data-category="action">

                    ⚔️ Action

                </button>


                <button
                    class="category-btn"
                    data-category="shooter">

                    🔫 Shooter

                </button>


                <button
                    class="category-btn"
                    data-category="adventure">

                    🗺️ Adventure

                </button>


                <button
                    class="category-btn"
                    data-category="rpg">

                    🧙 RPG

                </button>


                <button
                    class="category-btn"
                    data-category="racing">

                    🏎️ Racing

                </button>


                <button
                    class="category-btn"
                    data-category="sports">

                    ⚽ Sports

                </button>


                <button
                    class="category-btn"
                    data-category="strategy">

                    ♟️ Strategy

                </button>


                <button
                    class="category-btn"
                    data-category="indie">

                    🎨 Indie

                </button>

            </div>


            <div
                class="game-grid"
                id="categoryGames">

                <div class="loading">
                    Loading...
                </div>

            </div>

        </section>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-content">

            <div class="logo">
                <a href="index.html">
                    Game<span>Hub</span>
                </a>
            </div>


            <p>
                Discover games, ratings and information.
            </p>

        </div>


        <p class="copyright">
            © 2026 GameHub — Powered by RAWG
        </p>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script/supabase.js"></script>
    <script src="script/main.js"></script>

</body>

</html>
